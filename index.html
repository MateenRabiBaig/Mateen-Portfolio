    <meta

    <meta property="og:type" content="website" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg?v=mateen-logo-2"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg?v=mateen-logo-2"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong one.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var requested = params.get("theme");
        var stored = localStorage.getItem("theme");
        var theme =
          requested === "dark" || requested === "light"
            ? requested
            : stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
